<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="woodBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F2E5C5"/>
      <stop offset="55%" stop-color="#E9D6AC"/>
      <stop offset="100%" stop-color="#C8A976"/>
    </linearGradient>
    <radialGradient id="skinGrad" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0%" stop-color="#FFFCEE"/>
      <stop offset="60%" stop-color="#F5EDD8"/>
      <stop offset="100%" stop-color="#E4D6B2"/>
    </radialGradient>
    <linearGradient id="bachiGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B48A5E"/>
      <stop offset="50%" stop-color="#D8B080"/>
      <stop offset="100%" stop-color="#8B6A3C"/>
    </linearGradient>
    <pattern id="woodGrain" x="0" y="0" width="80" height="1024" patternUnits="userSpaceOnUse">
      <rect width="80" height="1024" fill="url(#woodBg)"/>
      <path d="M8 0 Q10 300 8 512 Q6 700 8 1024" stroke="#B8935A" stroke-width="0.6" fill="none" opacity="0.35"/>
      <path d="M28 0 Q26 200 28 512 Q30 800 28 1024" stroke="#A0824A" stroke-width="0.7" fill="none" opacity="0.28"/>
