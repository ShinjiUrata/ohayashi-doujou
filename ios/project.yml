name: OhayashiDoujou

options:
  minimumXcodeGenVersion: "2.40.0"
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: ja
  usesTabs: false
  indentWidth: 2
  tabWidth: 2
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

targets:
  OhayashiDoujou:
    type: application
    platform: iOS
    sources:
      - path: OhayashiDoujou
        excludes:
          - "Resources/Info.plist"
    resources:
      - path: OhayashiDoujou/Resources/Assets.xcassets
      - path: OhayashiDoujou/Resources/don.wav
      - path: OhayashiDoujou/Resources/ka.wav
      - path: OhayashiDoujou/Resources/StoreKitConfig.storekit
    settings:
      base:
        INFOPLIST_FILE: OhayashiDoujou/Resources/Info.plist
        PRODUCT_NAME: OhayashiDoujou
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: ""
        SWIFT_EMIT_LOC_STRINGS: YES
    scheme:
      testTargets:
        - OhayashiDoujouTests
      gatherCoverageData: true
      # Debug ビルドで実 App Store を叩かず、ローカル定義のプロダクトで
      # StoreKit をテストできるようにする。Sandbox テスターや実端末で
      # E2E する場合はここを OFF にする。
      storeKitConfiguration: OhayashiDoujou/Resources/StoreKitConfig.storekit

  OhayashiDoujouTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - OhayashiDoujouTests
    dependencies:
      - target: OhayashiDoujou
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zembrem.ohayashidoujou.tests
        GENERATE_INFOPLIST_FILE: YES
