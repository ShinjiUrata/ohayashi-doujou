name: terraform-ci

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-ci.yml"

concurrency:
  group: terraform-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: dev
            project_id: ohayashi-doujou-dev
            project_number: "722776000433"
          - env: prod
            project_id: ohayashi-doujou-prod
            project_number: "182257939236"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write # plan 結果をコメントするため

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP via WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ matrix.project_number }}/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: github-actions@${{ matrix.project_id }}.iam.gserviceaccount.com

      - name: Impersonate terraform SA
        # google-github-actions/auth はデフォルトで発行されたアクセストークンを
        # そのまま使うが、terraform SA を impersonate したいので token 経由で
        # ADC を用意する。
        run: |
          gcloud auth print-access-token \
            --impersonate-service-account=terraform@${{ matrix.project_id }}.iam.gserviceaccount.com \
            > /dev/null

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Write ${{ matrix.env }} tfvars
        working-directory: terraform
        env:
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          FILE="terraform.tfvars"
          if [ "${{ matrix.env }}" = "prod" ]; then
            FILE="env-prod.tfvars"
          fi
          cat > "$FILE" <<EOF
          project_id     = "${{ matrix.project_id }}"
          project_number = "${{ matrix.project_number }}"
          environment    = "${{ matrix.env }}"
          region         = "asia-northeast1"
          alert_email    = "$ALERT_EMAIL"
          EOF

      - name: Terraform init & plan (${{ matrix.env }})
        working-directory: terraform
        env:
          GOOGLE_IMPERSONATE_SERVICE_ACCOUNT: terraform@${{ matrix.project_id }}.iam.gserviceaccount.com
        run: |
          ./tf.sh ${{ matrix.env }} init >/dev/null
          ./tf.sh ${{ matrix.env }} plan -no-color 2>&1 | tee plan-${{ matrix.env }}.txt

      - name: Comment plan summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync(`terraform/plan-${{ matrix.env }}.txt`, 'utf-8');
            const truncated = plan.length > 60000 ? plan.slice(-60000) : plan;
            const body = `### terraform-ci: \`${{ matrix.env }}\` plan\n\n<details><summary>plan output (末尾 60000 文字)</summary>\n\n\`\`\`\n${truncated}\n\`\`\`\n</details>`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
