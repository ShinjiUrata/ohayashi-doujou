name: api-ci

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/api-ci.yml"
  push:
    branches: [main, dev]
    paths:
      - "backend/**"
      - ".github/workflows/api-ci.yml"

concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Docker build (image は push しない、CI 段階での失敗検知のみ)
        run: docker build -t ohayashi-doujou-api:ci .
