name: ios-ci

on:
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"
  push:
    branches: [main, dev]
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # macOS runner は有料枠、必要に応じて main / dev ブランチのみで走らせる方針。
    # PR CI では swiftpm と xcodegen の生成物までの smoke に留めても良い。
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate .xcodeproj
        working-directory: ios
        run: xcodegen generate

      - name: Pick an available iOS Simulator
        id: sim
        run: |
          # runner の Xcode に含まれる iOS Simulator の中から、実際に available
          # なものを 1 台選ぶ。GitHub Actions runner の Xcode バージョンが変わっても
          # 壊れないように、機種名を hard-code しない。
          DEVICE=$(xcrun simctl list devices available -j \
            | jq -r '.devices | to_entries[] | select(.key | test("iOS-")) | .value[] | select(.name | test("iPhone")) | .udid' \
            | head -1)
          if [ -z "$DEVICE" ]; then
            echo "No available iOS Simulator found."
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator UDID: $DEVICE"
          echo "udid=$DEVICE" >> "$GITHUB_OUTPUT"

      - name: Build & Test
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project OhayashiDoujou.xcodeproj \
            -scheme OhayashiDoujou \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -configuration Debug \
            test
